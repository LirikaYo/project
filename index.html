<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food+</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/fonts.css">
</head>

<body>
    <!-- ШАПКА (навигация) -->
    <header class="header">
        <div class="header__container">
            <div class="header__nav">
                <ul class="header__list">
                    <li><a class="header__list-link" href="#">Меню</a></li>
                    <li><a class="header__list-link" href="#">Доставка</a></li>
                    <li><a class="header__list-link" href="#">Оплата</a></li>
                </ul>
                <a class="header__button" href="#">Бронь столика</a>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ ЭКРАН (левая полоса + контент) -->
    <main class="main">
        <div class="first-screen">
            <!-- Левая полоса с логотипом и соцсетями -->
            <div class="left-bar">
                <div class="left-bar__logo">
                    <img src="images/logo.svg" alt="Логотип" width="80" height="46">
                </div>
                <div class="left-bar__socials">
                    <a href="#"><img src="images/YouTube_icon.svg" alt="YouTube" width="33.33" height="22.23"></a>
                    <a href="#"><img src="images/Vk_icon.svg" alt="VK" width="33.33" height="22.23"></a>
                    <a href="#"><img src="images/Telegram_icon.svg" alt="Telegram" width="33.33" height="22.23"></a>
                </div>
            </div>

            <!-- Контент справа -->
            <div class="first-screen__content">
                <h1 class="first-screen__title">
                    Видовой ресторан<br>
                    Food'Exxe Relo<br>
                    на Крестовском острове
                </h1>
            </div>
        </div>
    </main>
</body>

</html>
